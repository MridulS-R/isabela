services:
  - type: web
    name: visiondata-web
    env: ruby
    plan: free
    buildCommand: |
      bundle install
      bundle exec rake assets:precompile
    startCommand: bundle exec puma -C config/puma.rb
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: visiondata-web
          property: hostname

